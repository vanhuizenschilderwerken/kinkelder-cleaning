<aside aria-label="Snelle offerte aanvragen" class="quote-card">
  <h2>
    Waarvoor zoekt u reiniging?
  </h2>

  <form
    action="/offerte-aanvragen.html"
    class="quote-form"
    data-quote-form=""
    method="get"
  >

    <!-- DIENST -->
    <label>
      <span>
        Dienst
        <span aria-hidden="true" class="quote-form__required">*</span>
      </span>

      <select
        aria-required="true"
        name="dienst"
        required
      >
        <option disabled selected value="">
          Kies een dienst
        </option>

        <option value="zonnepanelen">
          Zonnepaneelreiniging
        </option>

        <option value="glasbewassing">
          Glasbewassing
        </option>

        <option value="dakkapel">
          Dakkapelreiniging
        </option>

        <option value="boeien">
          Boeireiniging
        </option>

        <option value="gevelbekleding">
          Gevelbekleding reinigen
        </option>

        <option value="houtwerk">
          Houtwerk reinigen
        </option>
      </select>
    </label>


    <!-- VOORNAAM + ACHTERNAAM -->
    <div class="quote-form__row">

      <label>
        <span>
          Voornaam
          <span aria-hidden="true" class="quote-form__required">*</span>
        </span>

        <input
          autocomplete="given-name"
          name="voornaam"
          placeholder="Bijv. Jan"
          required
          type="text"
        />
      </label>


      <label>
        <span>
          Achternaam
          <span aria-hidden="true" class="quote-form__required">*</span>
        </span>

        <input
          autocomplete="family-name"
          name="achternaam"
          placeholder="Bijv. Jansen"
          required
          type="text"
        />
      </label>

    </div>


    <!-- ADRES -->
    <div
      class="quote-form__address"
      aria-labelledby="quote-address-label"
    >

      <div
        class="quote-form__section-label"
        id="quote-address-label"
      >
        Adres
        <span aria-hidden="true" class="quote-form__required">*</span>
      </div>


      <!-- STRAAT + HUISNUMMER -->
      <div class="quote-form__row quote-form__row--address">

        <label>
          <span>
            Straatnaam
            <span aria-hidden="true" class="quote-form__required">*</span>
          </span>

          <input
            autocomplete="address-line1"
            name="straatnaam"
            placeholder="Bijv. Dorpsstraat"
            required
            type="text"
          />
        </label>


        <label>
          <span>
            Huisnummer
            <span aria-hidden="true" class="quote-form__required">*</span>
          </span>

          <input
            autocomplete="address-line2"
            name="huisnummer"
            placeholder="12A"
            required
            type="text"
          />
        </label>

      </div>


      <!-- POSTCODE + PLAATS -->
      <div class="quote-form__row quote-form__row--address">

        <label>
          <span>
            Postcode
            <span aria-hidden="true" class="quote-form__required">*</span>
          </span>

          <input
            autocomplete="postal-code"
            name="postcode"
            placeholder="7587 AB"
            required
            type="text"
          />
        </label>


        <label>
          <span>
            Plaats
            <span aria-hidden="true" class="quote-form__required">*</span>
          </span>

          <input
            autocomplete="address-level2"
            name="plaats"
            placeholder="Bijv. Losser"
            required
            type="text"
          />
        </label>

      </div>

    </div>


    <!-- TELEFOONNUMMER -->
    <label>
      <span>
        Telefoonnummer
        <span aria-hidden="true" class="quote-form__required">*</span>
      </span>

      <input
        autocomplete="tel"
        inputmode="tel"
        name="telefoon"
        placeholder="+31 6 ..."
        required
        type="tel"
      />
    </label>


    <button
      class="button button--primary"
      type="submit"
    >
      Start aanvraag
    </button>


    <p class="quote-form__note">
      Alle velden zijn verplicht. U gaat door naar de
      offertepagina met uw ingevulde gegevens.
    </p>

  </form>
</aside>
